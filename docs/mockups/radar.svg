<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="640" viewBox="0 0 240 320" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <title>HomeFlightTracker – Radaransicht (Mockup, 240×320)</title>
  <defs>
    <path id="ac" d="M0,-7 L1.4,-2.2 L7,1 L7,2.6 L1.4,1.2 L1,4.6 L3,6.2 L3,7.4 L0,6.6 L-3,7.4 L-3,6.2 L-1,4.6 L-1.4,1.2 L-7,2.6 L-7,1 L-1.4,-2.2 Z"/>
  </defs>
  <rect width="240" height="320" fill="#050b10"/>

  <!-- Statusleiste -->
  <rect width="240" height="22" fill="#0b1820"/>
  <circle cx="9" cy="11" r="3.5" fill="#3ddc84"/>
  <text x="16" y="15" font-size="9" fill="#d8e6dc">WLAN</text>
  <circle cx="52" cy="11" r="3.5" fill="#3ddc84"/>
  <text x="59" y="15" font-size="9" fill="#d8e6dc">OpenSky</text>
  <text x="232" y="15" font-size="10" fill="#d8e6dc" text-anchor="end">14:32</text>
  <text x="8" y="36" font-size="9" fill="#8fb3a0">12 Flugzeuge</text>
  <text x="232" y="36" font-size="9" fill="#8fb3a0" text-anchor="end">Radius 50 km</text>

  <!-- Radar -->
  <g transform="translate(120,154)" fill="none" stroke-width="1">
    <circle r="112" stroke="#1f6f4a"/>
    <circle r="84" stroke="#164f36"/>
    <circle r="56" stroke="#1f6f4a"/>
    <circle r="28" stroke="#164f36"/>
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#10392a"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#10392a"/>
  </g>
  <text x="120" y="50" font-size="10" fill="#3ddc84" text-anchor="middle" font-weight="bold">N</text>
  <text x="229" y="157" font-size="8" fill="#2f8f63" text-anchor="middle">O</text>
  <text x="120" y="264" font-size="8" fill="#2f8f63" text-anchor="middle">S</text>
  <text x="11" y="157" font-size="8" fill="#2f8f63" text-anchor="middle">W</text>
  <text x="124" y="95" font-size="7" fill="#2f8f63">25</text>
  <text x="160" y="72" font-size="7" fill="#2f8f63">50 km</text>

  <!-- Standort -->
  <g transform="translate(120,154)" stroke="#d8e6dc" stroke-width="1.2">
    <line x1="-4" y1="0" x2="4" y2="0"/><line x1="0" y1="-4" x2="0" y2="4"/>
  </g>

  <!-- Flugzeuge (Symbol in Bewegungsrichtung gedreht) -->
  <g fill="#ffd34d">
    <use xlink:href="#ac" transform="translate(150,110) rotate(225)"/>
    <use xlink:href="#ac" transform="translate(70,90) rotate(110)"/>
    <use xlink:href="#ac" transform="translate(190,180) rotate(300)"/>
    <use xlink:href="#ac" transform="translate(95,205) rotate(20)"/>
    <use xlink:href="#ac" transform="translate(45,170) rotate(80)"/>
    <use xlink:href="#ac" transform="translate(160,235) rotate(350)"/>
    <use xlink:href="#ac" transform="translate(205,120) rotate(250)"/>
    <use xlink:href="#ac" transform="translate(132,60) rotate(170)"/>
    <use xlink:href="#ac" transform="translate(30,120) rotate(95)"/>
    <use xlink:href="#ac" transform="translate(178,82) rotate(200)"/>
  </g>
  <!-- veraltete Position (> 60 s ohne Kontakt): grau, ohne Bewegung -->
  <use xlink:href="#ac" transform="translate(85,240) rotate(45)" fill="#5d6b66"/>

  <!-- Ausgewähltes Flugzeug -->
  <circle cx="104" cy="128" r="11" fill="none" stroke="#ff7a3d" stroke-width="1.2"/>
  <use xlink:href="#ac" transform="translate(104,128) rotate(245)" fill="#ff7a3d"/>
  <rect x="58" y="138" width="92" height="22" rx="3" fill="#1a1208" stroke="#ff7a3d" stroke-width="0.8"/>
  <text x="62" y="148" font-size="8.5" fill="#ffb68f" font-weight="bold">DLH123</text>
  <text x="62" y="157" font-size="7.5" fill="#ffb68f">7600 m · 18,4 km</text>

  <!-- Aktualität -->
  <text x="120" y="280" font-size="8.5" fill="#8fb3a0" text-anchor="middle">Stand 14:31:50 · vor 15 s</text>

  <!-- Bedienleiste -->
  <g font-size="11" text-anchor="middle">
    <rect x="2" y="288" width="56" height="30" rx="5" fill="#0d2233" stroke="#2a6f99"/>
    <text x="30" y="308" fill="#d8e6dc" font-size="16">−</text>
    <rect x="62" y="288" width="56" height="30" rx="5" fill="#0d2233" stroke="#2a6f99"/>
    <text x="90" y="307" fill="#d8e6dc">Liste</text>
    <rect x="122" y="288" width="56" height="30" rx="5" fill="#0d2233" stroke="#2a6f99"/>
    <text x="150" y="307" fill="#d8e6dc">Menü</text>
    <rect x="182" y="288" width="56" height="30" rx="5" fill="#0d2233" stroke="#2a6f99"/>
    <text x="210" y="308" fill="#d8e6dc" font-size="16">+</text>
  </g>
</svg>
