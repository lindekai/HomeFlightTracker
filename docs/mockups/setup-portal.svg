<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>HomeFlightTracker – Einrichtungsportal auf dem Smartphone (Mockup)</title>
  <rect width="360" height="900" rx="24" fill="#0e1418"/>
  <rect x="10" y="10" width="340" height="880" rx="18" fill="#f4f6f5"/>

  <rect x="10" y="10" width="340" height="64" rx="18" fill="#0b1820"/>
  <rect x="10" y="50" width="340" height="24" fill="#0b1820"/>
  <text x="28" y="42" font-size="17" fill="#ffffff" font-weight="600">HomeFlightTracker</text>
  <text x="28" y="62" font-size="12" fill="#8fb3a0">Einrichtung</text>

  <!-- WLAN -->
  <text x="28" y="104" font-size="14" font-weight="600" fill="#0b1820">1 · WLAN</text>
  <rect x="28" y="114" width="304" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="137" font-size="13" fill="#222">MeinHeimnetz</text>
  <text x="300" y="137" font-size="11" fill="#6a7a74">▾</text>
  <rect x="28" y="158" width="304" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="181" font-size="13" fill="#222">••••••••••••</text>
  <text x="28" y="212" font-size="11" fill="#2e8b57">✓ Verbindung erfolgreich getestet</text>

  <!-- Standort -->
  <text x="28" y="246" font-size="14" font-weight="600" fill="#0b1820">2 · Radarstandort</text>
  <rect x="28" y="256" width="226" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="279" font-size="13" fill="#888">Ort oder Adresse</text>
  <rect x="260" y="256" width="72" height="36" rx="6" fill="#2a6f99"/>
  <text x="296" y="279" font-size="13" fill="#fff" text-anchor="middle">Suchen</text>
  <text x="28" y="312" font-size="11" fill="#6a7a74">oder Koordinaten direkt eingeben (ohne Online-Suche):</text>
  <rect x="28" y="320" width="148" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="343" font-size="13" fill="#888">Breite, z. B. 52.31</text>
  <rect x="184" y="320" width="148" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="196" y="343" font-size="13" fill="#888">Länge, z. B. 13.10</text>

  <!-- OpenSky -->
  <text x="28" y="390" font-size="14" font-weight="600" fill="#0b1820">3 · OpenSky-Zugang</text>
  <rect x="28" y="400" width="304" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="423" font-size="13" fill="#888">Client-ID</text>
  <rect x="28" y="444" width="304" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="467" font-size="13" fill="#888">Client-Secret</text>
  <rect x="28" y="488" width="150" height="32" rx="6" fill="#fff" stroke="#2a6f99"/>
  <text x="103" y="509" font-size="12" fill="#2a6f99" text-anchor="middle">Verbindung testen</text>

  <!-- Radar -->
  <text x="28" y="556" font-size="14" font-weight="600" fill="#0b1820">4 · Radar</text>
  <text x="28" y="580" font-size="12" fill="#444">Reichweite</text>
  <g font-size="12" text-anchor="middle">
    <rect x="120" y="564" width="66" height="28" rx="6" fill="#fff" stroke="#c9d3cf"/><text x="153" y="583" fill="#444">25 km</text>
    <rect x="192" y="564" width="66" height="28" rx="6" fill="#2a6f99"/><text x="225" y="583" fill="#fff">50 km</text>
    <rect x="264" y="564" width="68" height="28" rx="6" fill="#fff" stroke="#c9d3cf"/><text x="298" y="583" fill="#444">100 km</text>
  </g>
  <text x="28" y="618" font-size="12" fill="#444">Abrufintervall</text>
  <rect x="120" y="602" width="212" height="28" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="132" y="621" font-size="12" fill="#222">60 s</text>
  <text x="318" y="621" font-size="11" fill="#6a7a74" text-anchor="end">▾</text>
  <rect x="28" y="640" width="304" height="46" rx="6" fill="#e8f3ec" stroke="#b9dcc6"/>
  <text x="40" y="659" font-size="11.5" fill="#1e5e3a">≈ 1 440 Credits pro Tag (36 % von 4 000)</text>
  <text x="40" y="676" font-size="11" fill="#4a7a5e">Bounding Box 5,3 Quadratgrad → 1 Credit je Abruf</text>

  <!-- Gerät -->
  <text x="28" y="720" font-size="14" font-weight="600" fill="#0b1820">5 · Geräte-Passwort</text>
  <rect x="28" y="730" width="304" height="36" rx="6" fill="#fff" stroke="#c9d3cf"/>
  <text x="40" y="753" font-size="13" fill="#888">Passwort für die Weboberfläche</text>

  <rect x="28" y="800" width="304" height="46" rx="8" fill="#2e8b57"/>
  <text x="180" y="829" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">Speichern &amp; starten</text>
  <text x="180" y="870" font-size="10" fill="#8a9590" text-anchor="middle">Geheimnisse werden nach dem Speichern nie wieder angezeigt.</text>
</svg>
